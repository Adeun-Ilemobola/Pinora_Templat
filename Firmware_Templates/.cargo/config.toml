[build]
target = "xtensa-esp32-espidf"
# Keep ESP-IDF build output on a short Windows path (ESP-IDF builds fail on long
# Windows paths). Other machines: set CARGO_TARGET_DIR, which overrides this
# (audit Phase 2E, PIN-TPL-015); `just flash` and the C:/t cache keep working.
target-dir = "C:/t"

[target.'cfg(target_os = "espidf")']
linker = "ldproxy"
runner = "espflash flash --monitor"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
CARGO_WORKSPACE_DIR = { value = "", relative = true }
MCU = "esp32"
ESP_IDF_VERSION = "v5.5.3"
ESP_IDF_TOOLS_INSTALL_DIR = "workspace"
