[package]
name = "pinora-ui"
version = "0.1.0"
edition = "2024"

[dependencies]
pinora-protocol = { path = "../protocol" }
slint = { git = "https://github.com/slint-ui/slint", branch = "pre-release/1.18" }
serialport = "4.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
slint-build = { git = "https://github.com/slint-ui/slint", branch = "pre-release/1.18" }

[profile.release]
codegen-units = 1
lto = true